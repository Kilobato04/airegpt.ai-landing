# ═══════════════════════════════════════════════════════════════
#  AIreGPT · netlify.toml
#  ─────────────────────────────────────────────────────────────
#  ENV VARS to set in Netlify UI → Site settings → Environment:
#    AIR_QUALITY_API_URL = https://y4zwdmw7vf.execute-api.us-east-1.amazonaws.com/prod/api/air-quality/current?type=reference
# ═══════════════════════════════════════════════════════════════

[build]
  publish = "."               # root is the publish directory (index.html at root)
  functions = "netlify/functions"

# ── Redirects: proxy air-quality API through Netlify Function ──
# The browser calls /.netlify/functions/air-quality
# The function calls the real AWS endpoint using the env var
[[redirects]]
  from   = "/api/air-quality"
  to     = "/.netlify/functions/air-quality"
  status = 200

# ── Security & caching headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.telegram.org https://www.facebook.com https://connect.facebook.net; frame-src https://www.facebook.com;"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache webmanifest
[[headers]]
  for = "*.webmanifest"
  [headers.values]
    Content-Type  = "application/manifest+json"
    Cache-Control = "public, max-age=86400"
